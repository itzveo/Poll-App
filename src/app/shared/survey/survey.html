<section class="survey-page">
  <app-main-header (newSurvey)="openNewSurvey()"></app-main-header>
  @if (showNewSurvey()) {
    <app-new-survey (closed)="closeNewSurvey()"></app-new-survey>
  }
  <div class="survey-overview">
    <section class="survey-wrapper">
      <div class="content-wrapper">
        <app-header
          [category]="survey()?.category"
          [name]="survey()?.name"
          [end_date]="survey()?.end_date"
          [description]="survey()?.description"
        ></app-header>
        <section class="question-wrapper">
          @for (question of questions(); track question.id; let i = $index) {
            <app-question
              [question]="question"
              [index]="i"
              (selectionChange)="onSelectionChange($event)"
            ></app-question>
          }
        </section>
      </div>
      <div class="button-wrapper">
        <button class="complete_btn" (click)="submitAnswers()" [disabled]="!allAnswered()">
          Complete survey
        </button>
      </div>
    </section>
    <section class="result-wrapper">
      <button class="results-toggle" id="results-toggle">
        Close results<img src="assets/drop_down.svg" alt="" /><img
          src="assets/drop_down_hover.svg"
          alt=""
        />
      </button>
      <div class="title-wrapper">
        <h2>Survey results</h2>
        <h2 class="orange">LIVE</h2>
      </div>
      <div class="question-wrapper">
        @if (hasResults()) {
          @for (question of questions(); track question.id) {
            <app-result-question
              [question]="question"
              [previewSelections]="selections().get(question.id) ?? []"
            ></app-result-question>
          }
        } @else {
          <app-empty></app-empty>
        }
      </div>
    </section>
  </div>
</section>
