<section class="result-question">
  <span>{{ question.question_text }}</span>
  @for (answer of question.answers; track answer.id; let i = $index) {
    <div class="option">
      <span class="label">{{ getLabel(i) }}.</span>
      <div class="bar">
        <div
          class="bar__inner"
          [style.width.%]="getPercent(answer)"
        ></div>
      </div>
      <span class="percent">{{ getPercent(answer) }}%</span>
    </div>
  }
</section>
